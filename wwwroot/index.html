<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#075985" />
  <title>PharmaCare POS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/app.css?v=6.3" />
</head>
<body>
  <!--
    PURPOSE:
    Root mounting point for the pharmacy SaaS single-page application.
    REFERENCE:
    app.js renders every screen here so the service worker can cache one consistent offline shell.
  -->
  <div id="app"></div>
  <div id="toastHost" class="toast-host"></div>
  <script src="/js/offline-db.js?v=6.3"></script>
  <!-- PURPOSE: Optional local direct-print bridge. REFERENCE: QZ Tray exposes local printers to the browser when the desktop QZ Tray app is installed. -->
  <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.3.0/qz-tray.js"></script>
  <!-- PURPOSE: Client-side PDF report generation. REFERENCE: jsPDF + AutoTable generate downloadable pharmacy reports with repeating company headers. -->
  <script src="/lib/jspdf.umd.min.js?v=6.3"></script>
  <script src="/lib/jspdf.plugin.autotable.min.js?v=6.3"></script>
  <script src="/js/app.js?v=6.3"></script>
</body>
</html>
